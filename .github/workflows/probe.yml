name: Probe member sites
# Manual debugging aid: saves raw HTML from member sites (house.gov blocks some networks).
on:
  workflow_dispatch:
    inputs:
      bioguides:
        description: "Space-separated bioguide ids (blank = every site not OK in data/health.json)"
        required: false
        default: ""
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests
      - run: python scripts/probe.py ${{ inputs.bioguides }}
      - uses: actions/upload-artifact@v4
        with:
          name: probe
          path: probe
          retention-days: 3
