name: Probe member sites
# Manual debugging aid: saves raw HTML from member sites (house.gov blocks some networks).
on:
  workflow_dispatch:
    inputs:
      bioguides:
        description: "Space-separated bioguide ids (blank = every site not OK in data/health.json)"
        required: false
        default: ""
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests
      - run: python scripts/probe.py ${{ inputs.bioguides }}
      - name: Publish snapshots to the "probe" branch
        run: |
          cd probe
          git init -q -b probe
          git config user.name "github-actions[bot]"
          git config user.email "41898299+github-actions[bot]@users.noreply.github.com"
          git add -A && git commit -q -m "Site snapshots $(date -u +%Y-%m-%dT%H:%MZ)"
          git push -q -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" probe:probe
