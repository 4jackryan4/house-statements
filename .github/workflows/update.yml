name: Update statements and site

on:
  schedule:
    # Each run starts the next one itself, 20 minutes after it started (see the last step), because
    # GitHub often skips or delays scheduled runs. The hourly schedule restarts that chain if it stops.
    - cron: "23 * * * *"
    - cron: "7 9 * * *"    # daily sweep: every site's press page, for statements the scrapers miss
  workflow_dispatch:
    inputs:
      sweep:
        description: "Check every member site with the generic scraper too"
        type: boolean
        default: false
      pages:
        description: "Listing pages to read per site (more = backfill further back)"
        default: "1"
      max_text:
        description: "Most statement pages to fetch text for"
        default: "600"
      only:
        description: "Only scrape these sources: bioguide ids or committee ids, \"committees\" or \"agencies\" (blank = all)"
        default: ""
      chained:
        description: "Started by the previous run: wait until 20 minutes after it started"
        type: boolean
        default: false
  push:
    branches: [main]
    paths: ["house_statements/**", "web/**", "scripts/**", ".github/workflows/update.yml"]

permissions:
  actions: write   # to start the next run
  contents: write
  pages: write
  id-token: write

concurrency:
  group: update
  cancel-in-progress: false

env:
  # dwillis/python-statement: the per-site press release scrapers. Bump to pick up fixes.
  PYTHON_STATEMENT_REF: 432b04432e359e016a8cea65d8805da92fee1789
  INTERVAL_MINUTES: 20
  GH_TOKEN: ${{ github.token }}

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      # Space scheduled and chained runs INTERVAL_MINUTES apart. A skipped or cancelled run loses
      # nothing: every run reads the sites' latest listings and adds whatever isn't on the site yet.
      - name: Wait for the next slot
        if: github.event_name == 'schedule' || inputs.chained
        run: |
          prev=$(gh run list -R "$GITHUB_REPOSITORY" -w update.yml -L 20 --json databaseId,startedAt,status,conclusion \
            -q "[.[] | select(.databaseId != $GITHUB_RUN_ID and .status == \"completed\" and .conclusion != \"cancelled\" and .conclusion != \"skipped\")][0].startedAt")
          [ -n "$prev" ] || exit 0
          wait=$(( $(date -d "$prev" +%s) + INTERVAL_MINUTES * 60 - $(date +%s) ))
          [ "$wait" -gt $(( INTERVAL_MINUTES * 60 )) ] && wait=$(( INTERVAL_MINUTES * 60 ))
          if [ "$wait" -gt 0 ]; then echo "Previous run started $prev; waiting ${wait}s"; sleep "$wait"; fi

      # Latest main, not the commit that triggered the run, so data committed by the previous
      # run is included and the commit below can't conflict with it.
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/checkout@v4
        with:
          repository: dwillis/python-statement
          ref: ${{ env.PYTHON_STATEMENT_REF }}
          path: .vendor/python-statement

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: |
          pip install -r requirements.txt ./.vendor/python-statement
          npm ci

      - name: Test
        run: python -m pytest -q

      - name: Refresh member list
        run: python -m house_statements.members
        env:
          PYTHON_STATEMENT_DIR: .vendor/python-statement

      - name: Import the congress-press daily archive
        run: python -m house_statements.import_archive --min-hours 6

      - name: Scrape member websites
        # A blocked or broken site shouldn't stop the archive data from publishing.
        continue-on-error: true
        run: |
          args="--pages ${{ inputs.pages || 1 }} --max-text ${{ inputs.max_text || 600 }} --minutes 25"
          if [ "${{ inputs.sweep }}" = "true" ] || [ "${{ github.event.schedule }}" = "7 9 * * *" ]; then
            args="$args --sweep"
          fi
          only="${{ inputs.only }}"
          # A virtual display lets the agency scraper open Chrome for sites with JavaScript challenges.
          xvfb-run -a python -m house_statements.collect $args ${only:+--only $only}

      - name: Commit new statements
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898299+github-actions[bot]@users.noreply.github.com"
          git add data
          git diff --cached --quiet && exit 0
          # Fold this run's data into the latest main rather than rebasing onto it: a backfill
          # committed meanwhile rewrites the same month files, and a rebase would drop its lines.
          rm -rf "$RUNNER_TEMP/run-data" && cp -r data "$RUNNER_TEMP/run-data"
          for attempt in 1 2 3 4 5; do
            git fetch -q origin main && git reset -q --hard origin/main
            python -m house_statements.collect --union "$RUNNER_TEMP/run-data/statements"
            cp "$RUNNER_TEMP/run-data/"*.json data/
            git add data
            git diff --cached --quiet && exit 0
            git commit -q -m "Update statements $(date -u +%Y-%m-%dT%H:%MZ)"
            git push -q origin HEAD:main && exit 0
            sleep 20
          done
          exit 1

      # Search indexes for older quarters, from the last run that changed them (build_index.mjs).
      - id: index-cache
        uses: actions/cache/restore@v4
        with:
          path: build/pagefind-cache
          key: pagefind-none
          restore-keys: pagefind-

      - name: Build site
        run: |
          python -m house_statements.build_site
          node scripts/build_index.mjs

      - if: steps.index-cache.outputs.cache-matched-key != format('pagefind-{0}', hashFiles('build/pagefind-key.txt'))
        uses: actions/cache/save@v4
        with:
          path: build/pagefind-cache
          key: pagefind-${{ hashFiles('build/pagefind-key.txt') }}

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deploy
        uses: actions/deploy-pages@v4

      # Not when cancelled, so cancelling a run stops the chain (the hourly schedule restarts it).
      - name: Start the next run
        if: success() || failure()
        run: gh workflow run update.yml -R "$GITHUB_REPOSITORY" --ref main -f chained=true
