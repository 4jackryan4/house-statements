name: Update statements and site

on:
  schedule:
    - cron: "23 * * * *"   # every hour
    - cron: "7 9 * * *"    # daily sweep: every site's press page, for statements the scrapers miss
  workflow_dispatch:
    inputs:
      sweep:
        description: "Check every member site with the generic scraper too"
        type: boolean
        default: false
      pages:
        description: "Listing pages to read per site (more = backfill further back)"
        default: "1"
      max_text:
        description: "Most statement pages to fetch text for"
        default: "600"
      only:
        description: "Only scrape these sources: bioguide ids or committee ids, \"committees\" or \"agencies\" (blank = all)"
        default: ""
  push:
    branches: [main]
    paths: ["house_statements/**", "web/**", "scripts/**", ".github/workflows/update.yml"]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: update
  cancel-in-progress: false

env:
  # dwillis/python-statement: the per-site press release scrapers. Bump to pick up fixes.
  PYTHON_STATEMENT_REF: 432b04432e359e016a8cea65d8805da92fee1789

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      # Latest main, not the commit that triggered the run, so data committed by the previous
      # run is included and the commit below can't conflict with it.
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/checkout@v4
        with:
          repository: dwillis/python-statement
          ref: ${{ env.PYTHON_STATEMENT_REF }}
          path: .vendor/python-statement

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: |
          pip install -r requirements.txt ./.vendor/python-statement
          npm ci

      - name: Test
        run: python -m pytest -q

      - name: Refresh member list
        run: python -m house_statements.members
        env:
          PYTHON_STATEMENT_DIR: .vendor/python-statement

      - name: Import the congress-press daily archive
        run: python -m house_statements.import_archive --min-hours 6

      - name: Scrape member websites
        # A blocked or broken site shouldn't stop the archive data from publishing.
        continue-on-error: true
        run: |
          args="--pages ${{ inputs.pages || 1 }} --max-text ${{ inputs.max_text || 600 }} --minutes 25"
          if [ "${{ inputs.sweep }}" = "true" ] || [ "${{ github.event.schedule }}" = "7 9 * * *" ]; then
            args="$args --sweep"
          fi
          only="${{ inputs.only }}"
          # A virtual display lets the agency scraper open Chrome for sites with JavaScript challenges.
          xvfb-run -a python -m house_statements.collect $args ${only:+--only $only}

      - name: Commit new statements
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898299+github-actions[bot]@users.noreply.github.com"
          git add data
          git diff --cached --quiet && exit 0
          # Fold this run's data into the latest main rather than rebasing onto it: a backfill
          # committed meanwhile rewrites the same month files, and a rebase would drop its lines.
          rm -rf "$RUNNER_TEMP/run-data" && cp -r data "$RUNNER_TEMP/run-data"
          for attempt in 1 2 3 4 5; do
            git fetch -q origin main && git reset -q --hard origin/main
            python -m house_statements.collect --union "$RUNNER_TEMP/run-data/statements"
            cp "$RUNNER_TEMP/run-data/"*.json data/
            git add data
            git diff --cached --quiet && exit 0
            git commit -q -m "Update statements $(date -u +%Y-%m-%dT%H:%MZ)"
            git push -q origin HEAD:main && exit 0
            sleep 20
          done
          exit 1

      - name: Build site
        run: |
          python -m house_statements.build_site
          node scripts/build_index.mjs

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deploy
        uses: actions/deploy-pages@v4
